logging:
  level:
    ROOT: INFO
    nl: DEBUG

spring:
  application:
    name: bre
  datasource:
    url: jdbc:h2:file:./data/bre;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
